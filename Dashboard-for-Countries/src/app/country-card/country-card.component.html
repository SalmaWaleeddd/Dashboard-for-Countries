@for ( country of countries(); track country.name ) {
<div class="country-card">
    <img [src]="country.flagUrl" [alt]="country.name + ' flag'" width="100" height="60" />
    <h3>{{country.name}}</h3>
    <p>{{country.region}}</p>
    <p>{{country.population}}</p>
    <button>→ Details</button>
</div>
}@empty{
<p>No countries found.</p>
}
